<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d6efd">
    
    <title>Acceso Seguro | Lab Track</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><path fill=%22%230d6efd%22 d=%22M352 320c-23.03 0-44.42 8.35-61.1 22.06l-67.9-20.94c4.6-11.41 7-23.59 7-36.12 0-53.02-42.98-96-96-96s-96 42.98-96 96 42.98 96 96 96c8.48 0 16.63-1.11 24.39-3.18l67.35 20.77C226.04 443.34 224 447.45 224 452c0 33.14 26.86 60 60 60h168c33.14 0 60-26.86 60-60v-72c0-33.14-26.86-60-60-60H352z%22/></svg>">

    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { max-width: 420px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #ffffff; }
        .brand-logo { width: 64px; height: 64px; background: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin: 0 auto 1.5rem; font-size: 1.8rem; }
        .form-control { padding: 0.75rem 1rem; border-radius: 10px; }
        .btn-primary { padding: 0.8rem; border-radius: 10px; font-weight: 700; transition: all 0.3s; }
        .input-group-text { cursor: pointer; border-radius: 0 10px 10px 0; }
    </style>
</head>
<body>

    <div class="card login-card p-4 p-md-5">
        <div class="card-body">
            <div class="brand-logo shadow-sm">
                <i class="fas fa-microscope"></i>
            </div>
            
            <h3 class="text-center fw-bold text-dark mb-1">Lab Track</h3>
            <p class="text-center text-muted small mb-4">Panel de Administración</p>

            <div id="error-alert" class="alert alert-danger d-none text-center small py-2 mb-4" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="error-msg"></span>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Correo Electrónico</label>
                    <input type="email" class="form-control bg-light" id="email" placeholder="admin@laboratorio.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control bg-light" id="password" placeholder="••••••••" required>
                        <span class="input-group-text bg-light text-muted" id="btn-toggle-pass">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </span>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="btn-login">
                        ENTRAR AL SISTEMA
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted text-uppercase fw-bold" style="font-size: 10px; letter-spacing: 1px;">
                    <i class="fas fa-lock me-1"></i> Acceso Encriptado
                </small>
            </div>
        </div>
    </div>

    <script type="module">
       import { intentarLogin, manejarErrorAuth } from './js/controllers/authController.js';
        import { ui } from './js/views/uiView.js'; // Asumiendo que aquí tienes mostrarError y mostrarCarga

        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. Mostrar estado de carga (Feedback visual)
           ui.setLoading(true); 

        try {
            await intentarLogin(email, password);
            window.location.href = 'dashboard.html';
        } catch (error) {
            const mensaje = manejarErrorAuth(error.code);
            // 2. Aquí ya usas mostrarError que sí existe en tu objeto
            ui.mostrarError(mensaje); 
        } finally {
            // 3. Cambia mostrarCarga por setLoading
            ui.setLoading(false); 
        }
                });
    </script>
</body>
</html>
