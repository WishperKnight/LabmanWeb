<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d6efd">
    
    <title>Acceso Seguro | Lab Track</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { max-width: 420px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #ffffff; }
        .brand-logo { width: 64px; height: 64px; background: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; margin: 0 auto 1.5rem; font-size: 1.8rem; }
        .form-control { padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid #dee2e6; }
        .btn-primary { padding: 0.8rem; border-radius: 10px; font-weight: 700; transition: all 0.3s; }
        .input-group-text { cursor: pointer; border-radius: 0 10px 10px 0; background: #f8f9fa; }
        .forgot-password-link { font-size: 0.85rem; color: #0d6efd; text-decoration: none; font-weight: 600; }
        .forgot-password-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card login-card p-4 p-md-5">
        <div class="card-body">
            <div class="brand-logo shadow-sm">
                <i class="fas fa-microscope"></i>
            </div>
            
            <h3 class="text-center fw-bold text-dark mb-1">Lab Track</h3>
            <p class="text-center text-muted small mb-4">Panel de Administración</p>

            <div id="error-alert" class="alert alert-danger d-none text-center small py-2 mb-4" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="error-msg"></span>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Correo Electrónico</label>
                    <input type="email" class="form-control bg-light" id="email" placeholder="admin@laboratorio.com" required>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Contraseña</label>
                        <a href="#" class="forgot-password-link" data-bs-toggle="modal" data-bs-target="#resetPasswordModal">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control bg-light" id="password" placeholder="••••••••" required>
                        <span class="input-group-text bg-light text-muted" id="btn-toggle-pass">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </span>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="btn-login">
                        ENTRAR AL SISTEMA
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted text-uppercase fw-bold" style="font-size: 10px; letter-spacing: 1px;">
                    <i class="fas fa-lock me-1"></i> Acceso Encriptado
                </small>
            </div>
        </div>
    </div>

    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-primary mb-3"></i>
                        <h4 class="fw-bold">Recuperar Acceso</h4>
                        <p class="text-muted small">Introduce tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
                    </div>
                    <form id="reset-password-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary text-uppercase">Correo de recuperación</label>
                            <input type="email" class="form-control bg-light" id="reset-email" placeholder="tu-correo@ejemplo.com" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" id="btn-reset">ENVIAR ENLACE</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { intentarLogin, manejarErrorAuth, enviarCorreoRecuperacion } from './js/controllers/authController.js';
        import { ui } from './js/views/uiView.js';

        const loginForm = document.getElementById('login-form');
        const resetForm = document.getElementById('reset-password-form');
        const passInput = document.getElementById('password');
        const btnTogglePass = document.getElementById('btn-toggle-pass');
        const eyeIcon = document.getElementById('eye-icon');

        // Alternar Ver Contraseña
        btnTogglePass.addEventListener('click', () => {
            const type = passInput.type === 'password' ? 'text' : 'password';
            passInput.type = type;
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // Lógica de Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            ui.setLoading(true); 
            try {
                await intentarLogin(email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                const mensaje = manejarErrorAuth(error.code);
                ui.mostrarError(mensaje); 
            } finally {
                ui.setLoading(false); 
            }
        });

        // Lógica de Recuperación de Contraseña
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            
            ui.setLoading(true);
            try {
                await enviarCorreoRecuperacion(email);
                alert('Correo de recuperación enviado. Revisa tu bandeja de entrada.');
                // Cerrar el modal
                bootstrap.Modal.getInstance(document.getElementById('resetPasswordModal')).hide();
            } catch (error) {
                alert(manejarErrorAuth(error.code));
            } finally {
                ui.setLoading(false);
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
