<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Lab Track</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
       <link rel="icon" href="./assets/icons/favicon.svg">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.min.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><path fill=%22%233b82f6%22 d=%22M352 320c-23.03 0-44.42 8.35-61.1 22.06l-67.9-20.94c4.6-11.41 7-23.59 7-36.12 0-53.02-42.98-96-96-96s-96 42.98-96 96 42.98 96 96 96c8.48 0 16.63-1.11 24.39-3.18l67.35 20.77C226.04 443.34 224 447.45 224 452c0 33.14 26.86 60 60 60h168c33.14 0 60-26.86 60-60v-72c0-33.14-26.86-60-60-60H352zM134 320c-18.78 0-34-15.22-34-34s15.22-34 34-34 34 15.22 34 34-15.22 34-34 34z%22/></svg>">
</head>
<body class="bg-light">

    <div id="sidebar-container"></div>

    <main class="main">
        <div class="container-fluid py-4">
            
            <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 mt-2 gy-3">
                <div class="header-titles">
                    <h2 class="fw-bold text-dark m-0">Gestión de Inventario</h2>
                    <p class="text-muted small m-0">Control de stock por porcentaje y alertas críticas</p>
                </div>
                <div class="d-flex gap-2 action-buttons">
                    <button class="btn btn-outline-primary rounded-pill px-3 fw-bold shadow-sm btn-sm" id="btn-importar-trigger">
                        <i class="fas fa-file-upload me-2"></i>Importar
                    </button>
                    <input type="file" id="input-importar" accept=".csv" class="d-none">
                    
                    <button class="btn btn-outline-success rounded-pill px-3 fw-bold shadow-sm btn-sm" id="btn-exportar-csv">
                        <i class="fas fa-file-download me-2"></i>Exportar
                    </button>
                    
                    <button class="btn btn-primary rounded-pill px-3 fw-bold shadow-sm btn-sm" id="btn-nuevo-articulo">
                        <i class="fas fa-plus me-2"></i>Añadir Registro
                    </button>
                </div>
            </header>

            <div class="card border-0 shadow-sm mb-4 rounded-4">
                <div class="card-body p-2 px-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="busqueda" class="form-control border-0 shadow-none" placeholder="Buscar por nombre, lote o marca...">
                    </div>
                </div>
            </div>

            <ul class="nav nav-pills mb-4 bg-white p-2 rounded-pill shadow-sm d-inline-flex border">
                <li class="nav-item">
                    <button class="nav-link active rounded-pill px-4 fw-bold" id="tab-reactivos" data-tipo="reactivo">
                        <i class="fas fa-vial me-2"></i>Reactivos
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link rounded-pill px-4 fw-bold" id="tab-fungibles" data-tipo="fungible">
                        <i class="fas fa-box-tissue me-2"></i>Fungibles / Equipos
                    </button>
                </li>
            </ul>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="bg-light text-muted small fw-bold text-uppercase">
                            <tr id="encabezados-tabla">
                                </tr>
                        </thead>
                        <tbody id="lista-materiales">
                            <tr>
                                <td colspan="6" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <p class="mt-2 text-muted">Sincronizando con el laboratorio...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center p-4">
                <div class="text-muted small">Total: <span id="pag-total" class="fw-bold">0</span> elementos</div>
                <nav>
                    <ul class="pagination pagination-sm m-0 gap-1" id="controles-paginacion"></ul>
                </nav>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalArticulo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <form id="form-articulo">
                    <div class="modal-header border-0 px-4 pt-4">
                        <h5 class="fw-bold m-0 text-primary" id="modal-titulo"><i class="fas fa-flask me-2"></i>Ficha Técnica</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <div class="modal-body p-4">
                        <input type="hidden" id="art-id">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Nombre del Producto / Activo</label>
                                <input type="text" id="art-nombre" class="form-control bg-light border-0 py-2" placeholder="Ej: Ácido Sulfúrico" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Categoría</label>
                                <select id="art-tipo" class="form-select bg-light border-0 py-2">
                                    <option value="reactivo">Reactivo</option>
                                    <option value="fungible">Fungible / Equipo</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Marca / Fabricante</label>
                                <input type="text" id="art-marca" class="form-control bg-light border-0 py-2" placeholder="Ej: Merck / LBG">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Código de Lote</label>
                                <input type="text" id="art-lote" class="form-control bg-light border-0 py-2" placeholder="LOT-XXXX">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-success">Stock Actual</label>
                                <div class="input-group">
                                    <input type="number" id="art-stock" class="form-control bg-light border-0 py-2" placeholder="0-100" required>
                                    <span class="input-group-text bg-light border-0">%</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-success">Capacidad Total</label>
                                <input type="text" id="art-stockTotal" class="form-control bg-light border-0 py-2" placeholder="Ej: 1000">
                            </div>

                            <div class="col-md-6 campo-reactivo">
                                <label class="form-label small fw-bold text-primary">Riqueza (%)</label>
                                <input type="text" id="art-riqueza" class="form-control border-primary-subtle py-2" placeholder="Ej: 98">
                            </div>
                            <div class="col-md-6 campo-reactivo">
                                <label class="form-label small fw-bold text-primary">Molaridad (M)</label>
                                <input type="text" id="art-molaridad" class="form-control border-primary-subtle py-2" placeholder="Ej: 0.5">
                            </div>

                            <div class="col-md-12 campo-fungible d-none">
                                <label class="form-label small fw-bold text-info">Capacidad o Especificación</label>
                                <input type="text" id="art-capacidad" class="form-control border-info-subtle py-2" placeholder="Ej: 500ml / 220V">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Fecha de Recepción</label>
                                <input type="date" id="art-recepcion" class="form-control bg-light border-0 py-2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Fecha de Caducidad</label>
                                <input type="date" id="art-caducidad" class="form-control bg-light border-0 py-2">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label small fw-bold text-secondary">Laboratorio de Ubicación</label>
                                <select id="art-laboratorio" class="form-select bg-light border-0 py-2" required>
                                    </select>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer border-0 p-4 pt-0">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                            <i class="fas fa-sync me-2"></i>Sincronizar con Inventario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { cargarSidebar } from './js/sidebar.js';
        import { InventarioController } from './js/controllers/InventarioController.js';

        cargarSidebar('inventario');

        document.addEventListener('DOMContentLoaded', () => {
            InventarioController.init();
        });
    </script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
