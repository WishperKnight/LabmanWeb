<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos Técnicos | Lab Track</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
      <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png">
    <link rel="manifest" href="./assets/icons/site.webmanifest">
    <link rel="stylesheet" href="./css/all.min.css">
    
    <style>
        .card-premium { border-radius: 1.2rem; overflow: hidden; }
        .badge-status { font-size: 0.7rem; font-weight: 600; padding: 0.5em 1em; }
        .btn-action { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-action:hover { transform: translateY(-2px); }
        .table thead th { background-color: #f8f9fa; border-top: none; }
    </style>

</head>
<body class="bg-light">

    <div id="sidebar-container"></div>

    <div class="main">
        <div class="container-fluid py-4">
            <div id="status-container"></div>

            <header class="d-flex justify-content-between align-items-center mb-5 mt-2">
                <div>
                    <h2 class="fw-bold text-dark m-0">Gestión de Equipos</h2>
                    <p class="text-muted small m-0">Inventario técnico y control de stock operativo.</p>
                </div>
                <div class="d-flex gap-2">
                    <label class="btn btn-outline-primary rounded-pill px-4 shadow-sm fw-bold mb-0" style="cursor: pointer;">
                        <i class="fas fa-file-csv me-2"></i>Importar
                        <input type="file" id="input-csv" accept=".csv" hidden>
                    </label>
                    <button class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" id="btn-abrir-modal">
                        <i class="fas fa-plus me-2"></i>Nuevo Equipo
                    </button>
                </div>
            </header>

            <div class="card card-premium border-0 shadow-sm bg-white">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="text-muted small fw-bold text-uppercase">
                            <tr>
                                <th class="ps-4 py-3">Equipo / Modelo</th>
                                <th>S/N / Marca</th>
                                <th>Categoría / Stock</th>
                                <th>Sede/Lab</th>
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-equipos">
                            <tr><td colspan="6" class="text-center p-5 text-muted small">Conectando con el servidor...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-flex justify-content-between align-items-center p-4 border-top">
                    <div class="text-muted small">
                        Mostrando <span id="pag-inicio" class="fw-bold">0</span> - <span id="pag-fin" class="fw-bold">0</span> de <span id="pag-total" class="fw-bold">0</span> registros
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm m-0 gap-1" id="controles-paginacion"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEquipo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="fw-bold m-0 text-primary" id="modal-titulo">Ficha Técnica de Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-equipo">
                    <input type="hidden" id="eq-id">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Nombre del Equipo</label>
                                <input type="text" id="eq-nombre" class="form-control bg-light border-0" placeholder="Ej: Espectrofotómetro" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Número de Serie (S/N)</label>
                                <input type="text" id="eq-serial" class="form-control bg-light border-0" placeholder="SN-12345">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Modelo / Referencia</label>
                                <input type="text" id="eq-modelo" class="form-control bg-light border-0" placeholder="Gen 5 Pro">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Fabricante / Marca</label>
                                <input type="text" id="eq-fabricante" class="form-control bg-light border-0" placeholder="Thermo Fisher">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Stock Actual</label>
                                <input type="number" id="eq-stock" class="form-control bg-light border-0" value="1" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Categoría</label>
                                <select id="eq-tipo" class="form-select bg-light border-0">
                                    <option value="Medición">Medición</option>
                                    <option value="Volumetría">Volumetría</option>
                                    <option value="Óptica">Óptica</option>
                                    <option value="Térmico">Térmico</option>
                                    <option value="Vidriería">Vidriería</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Laboratorio (Sede)</label>
                                <select id="eq-lab" class="form-select bg-light border-0" required>
                                    <option value="" disabled selected>Cargando sedes...</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label small fw-bold">Estado del Equipo</label>
                                <div class="d-flex gap-2">
                                    <select id="eq-estado" class="form-select bg-light border-0">
                                        <option value="Operativo">Operativo</option>
                                        <option value="Mantenimiento">Mantenimiento</option>
                                        <option value="Fuera de Servicio">Fuera de Servicio</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Observaciones Técnicas</label>
                                <textarea id="eq-obs" class="form-control bg-light border-0" rows="3" placeholder="Anotaciones sobre calibración o fallos..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Guardar Ficha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        // Importamos el sidebar y el controlador maestro de equipos
        import { cargarSidebar } from './js/sidebar.js';
        import { EquiposController } from './js/controllers/EquiposController.js';

        // Iniciamos UI
        cargarSidebar('equipos');

        // Iniciamos Lógica
        EquiposController.init();
    </script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
